{% extends 'moviebuff/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<section aria-labelledby="login-title">
    <h2 id="login-title" class="mb-4">Login</h2>
    <div class="row">
        <div class="col-md-6">
            <form method="post" class="mb-3">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
