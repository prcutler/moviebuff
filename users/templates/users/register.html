{% extends 'moviebuff/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<section aria-labelledby="register-title">
    <h2 id="register-title" class="mb-4">Register</h2>
    <div class="row">
        <div class="col-md-6">
            <form method="post" class="mb-3">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
