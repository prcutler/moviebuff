{% extends 'moviebuff/base.html' %}

{% block title %}Mark as Watched{% endblock %}

{% block content %}
<section aria-labelledby="watched-title">
    <h1 id="watched-title" class="h2 mb-4">Mark {{ movie.title }} as Watched</h1>
    <div class="row">
        <div class="col-md-6">
            <form method="post" class="mb-3">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
