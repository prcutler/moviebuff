{% extends 'moviebuff/base.html' %}

{% block title %}Add to Watchlist{% endblock %}

{% block content %}
<section aria-labelledby="watchlist-title">
    <h2 id="watchlist-title" class="mb-4">Add {{ movie.title }} to Watchlist</h2>
    <div class="row">
        <div class="col-md-6">
            <form method="post" class="mb-3">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
