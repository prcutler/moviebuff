<nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary mb-4">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'user_profile' %}active{% endif %}" href="{% url 'user_profile' user.username %}">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'search_movies' %}active{% endif %}" href="{% url 'search_movies' %}">Search</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}" href="{% url 'login' %}">Login</a>
                    </li>
                    {% if REGISTRATION_ENABLED %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'register' %}active{% endif %}" href="{% url 'register' %}">Register</a>
                    </li>
                    {% endif %}
                {% endif %}
            </ul>
            <ul class="navbar-nav align-items-center">
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                </li>
                {% endif %}
                <li class="nav-item">
                    <button id="theme-toggle" class="btn btn-outline-secondary btn-sm px-2" aria-label="Toggle dark mode">
                        <span id="theme-icon">🌙</span>
                    </button>
                </li>
            </ul>
            <script>
                (function() {
                    const btn = document.getElementById('theme-toggle');
                    const icon = document.getElementById('theme-icon');
                    const current = localStorage.getItem('theme') || 'dark';
                    icon.textContent = current === 'dark' ? '☀️' : '🌙';
                    btn.addEventListener('click', function() {
                        const html = document.documentElement;
                        const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                        html.setAttribute('data-bs-theme', next);
                        localStorage.setItem('theme', next);
                        icon.textContent = next === 'dark' ? '☀️' : '🌙';
                    });
                })();
            </script>
        </div>
    </div>
</nav>
